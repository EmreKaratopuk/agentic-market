[project]
name = "agentic-market"
version = "0.1.0"
description = "Multi-agent system for querying e-commerce data through natural language using Gemini, LangGraph, and Chainlit"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.9.6",
    "langchain>=1.2.6",
    "langchain-google-genai>=4.2.0",
    "langchain-groq>=1.1.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.0.7",
    "llm-guard[onnxruntime]>=0.3.16",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.17.0",
    "typer>=0.21.1",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
